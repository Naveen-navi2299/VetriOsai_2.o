<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-sh" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </radialGradient>
    <filter id="shadow-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#581C87" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="blanket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="pillow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="bear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="550" rx="36" fill="url(#bg-sh)"/>

  <!-- Nighttime Stars & Gentle Moon Aura -->
  <polygon points="80,70 82,76 88,78 82,80 80,86 78,80 72,78 78,76" fill="#FDE047"/>
  <polygon points="320,80 322,86 328,88 322,90 320,96 318,90 312,88 318,86" fill="#FDE047"/>
  <polygon points="120,130 121,134 125,135 121,136 120,140 119,136 115,135 119,134" fill="#FDF4FF"/>
  <polygon points="280,120 281,124 285,125 281,126 280,130 279,126 275,125 279,124" fill="#FDF4FF"/>
  <circle cx="200" cy="80" r="14" fill="#FDE047" opacity="0.8"/>
  <circle cx="206" cy="76" r="12" fill="#E9D5FF"/>

  <!-- Pillow -->
  <rect x="70" y="150" width="260" height="130" rx="36" fill="url(#pillow)" filter="url(#shadow-sh)"/>

  <!-- Sleeping Girl Head on Pillow -->
  <g filter="url(#shadow-sh)">
    <!-- Hair Spreading on Pillow -->
    <ellipse cx="190" cy="225" rx="76" ry="70" fill="#2E1065"/>

    <!-- Girl Face -->
    <ellipse cx="190" cy="235" rx="60" ry="64" fill="#FFE4E6"/>

    <!-- Hair Bangs -->
    <path d="M 134 210 Q 160 190 190 205 Q 220 190 246 210 Q 230 180 190 180 Q 150 180 134 210 Z" fill="#2E1065"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="150" cy="255" rx="14" ry="9" fill="#FB7185" opacity="0.5"/>
    <ellipse cx="230" cy="255" rx="14" ry="9" fill="#FB7185" opacity="0.5"/>

    <!-- Peaceful Closed Sleeping Eyes with Eyelashes -->
    <path d="M 148 230 Q 162 245 174 230" stroke="#3B0764" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <line x1="154" y1="240" x2="152" y2="246" stroke="#3B0764" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="162" y1="242" x2="162" y2="248" stroke="#3B0764" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="169" y1="239" x2="171" y2="245" stroke="#3B0764" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 206 230 Q 218 245 232 230" stroke="#3B0764" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <line x1="211" y1="239" x2="209" y2="245" stroke="#3B0764" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="218" y1="242" x2="218" y2="248" stroke="#3B0764" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="226" y1="240" x2="228" y2="246" stroke="#3B0764" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cute Nose & Sweet Closed Smile -->
    <ellipse cx="190" cy="245" rx="4" ry="3" fill="#F472B6"/>
    <path d="M 180 262 Q 190 270 200 262" stroke="#831843" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Finger to Lips "Shh" Gesture -->
  <g filter="url(#shadow-sh)">
    <path d="M 205 320 C 205 275 200 258 200 258 C 195 258 190 275 190 320 Z" fill="#FFE4E6"/>
    <ellipse cx="197" cy="256" rx="6" ry="9" fill="#FFE4E6"/>
  </g>

  <!-- Teddy Bear Cuddled next to girl -->
  <g transform="translate(80, 240)" filter="url(#shadow-sh)">
    <!-- Bear Ears -->
    <circle cx="35" cy="45" r="16" fill="url(#bear)"/>
    <circle cx="35" cy="45" r="9" fill="#FDE68A"/>
    <circle cx="85" cy="45" r="16" fill="url(#bear)"/>
    <circle cx="85" cy="45" r="9" fill="#FDE68A"/>

    <!-- Bear Head -->
    <ellipse cx="60" cy="70" rx="34" ry="30" fill="url(#bear)"/>

    <!-- Bear Snout -->
    <ellipse cx="60" cy="80" rx="16" ry="12" fill="#FEF3C7"/>
    <ellipse cx="60" cy="75" rx="6" ry="4" fill="#451A03"/>
    <path d="M 56 84 Q 60 88 64 84" stroke="#451A03" stroke-width="2" fill="none"/>

    <!-- Bear Sleeping Eyes -->
    <path d="M 45 65 Q 50 70 55 65" stroke="#451A03" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 65 65 Q 70 70 75 65" stroke="#451A03" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Cozy Purple Blanket / Duvet with Stars -->
  <g filter="url(#shadow-sh)">
    <path d="M 40 310 Q 200 290 360 310 L 370 550 L 30 550 Z" fill="url(#blanket)"/>
    <path d="M 40 310 Q 200 290 360 310 Q 200 325 40 310 Z" fill="#D8B4FE"/>

    <!-- Star patterns on blanket -->
    <polygon points="100,370 102,376 108,378 102,380 100,386 98,380 92,378 98,376" fill="#FDE047" opacity="0.9"/>
    <polygon points="170,420 172,426 178,428 172,430 170,436 168,430 162,428 168,426" fill="#FDE047" opacity="0.9"/>
    <polygon points="260,360 262,366 268,368 262,370 260,376 258,370 252,368 258,366" fill="#FDE047" opacity="0.9"/>
    <polygon points="220,470 222,476 228,478 222,480 220,486 218,480 212,478 218,476" fill="#FDE047" opacity="0.9"/>
    <polygon points="310,440 312,446 318,448 312,450 310,456 308,450 302,448 308,446" fill="#FDE047" opacity="0.9"/>
    <polygon points="120,480 122,486 128,488 122,490 120,496 118,490 112,488 118,486" fill="#FDE047" opacity="0.9"/>
  </g>
</svg>
