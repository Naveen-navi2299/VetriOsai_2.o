<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-ah" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="50%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </radialGradient>
    <filter id="shadow-ah" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#065F46" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="shirt-ah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="skin-ah" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="hair-ah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="550" rx="36" fill="url(#bg-ah)"/>

  <!-- Sunbeams / Shouting Sound Waves -->
  <path d="M 270 240 Q 320 220 370 240" stroke="#059669" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 280 270 Q 340 270 380 280" stroke="#059669" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 270 300 Q 320 320 370 310" stroke="#059669" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <path d="M 130 240 Q 80 220 30 240" stroke="#059669" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 120 270 Q 60 270 20 280" stroke="#059669" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 130 300 Q 80 320 30 310" stroke="#059669" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Character -->
  <g filter="url(#shadow-ah)">
    <!-- Shoulders & Orange Shirt -->
    <path d="M 90 550 C 90 420 130 395 200 395 C 270 395 310 420 310 550 Z" fill="url(#shirt-ah)"/>
    <path d="M 160 395 C 180 420 220 420 240 395 Z" fill="#FED7AA"/>

    <!-- Neck -->
    <rect x="175" y="350" width="50" height="55" rx="8" fill="url(#skin-ah)"/>

    <!-- Boy Head -->
    <ellipse cx="200" cy="260" rx="80" ry="88" fill="url(#skin-ah)"/>

    <!-- Big Happy Ears -->
    <circle cx="120" cy="265" r="20" fill="url(#skin-ah)"/>
    <circle cx="120" cy="265" r="11" fill="#F472B6" opacity="0.5"/>
    <circle cx="280" cy="265" r="20" fill="url(#skin-ah)"/>
    <circle cx="280" cy="265" r="11" fill="#F472B6" opacity="0.5"/>

    <!-- Cheeks -->
    <ellipse cx="145" cy="285" rx="16" ry="10" fill="#FB7185" opacity="0.5"/>
    <ellipse cx="255" cy="285" rx="16" ry="10" fill="#FB7185" opacity="0.5"/>

    <!-- Big Wide Open Mouth ("Aaa") -->
    <path d="M 160 265 C 160 340 240 340 240 265 C 215 272 185 272 160 265 Z" fill="#991B1B"/>
    <!-- Top White Teeth Bar -->
    <path d="M 168 268 C 185 275 215 275 232 268 C 230 278 170 278 168 268 Z" fill="#FFFFFF"/>
    <!-- Big Joyful Pink Tongue -->
    <path d="M 172 305 C 185 292 215 292 228 305 C 215 330 185 330 172 305 Z" fill="#F43F5E"/>

    <!-- Happy Eyes (Squinting with wide smile) -->
    <path d="M 148 230 Q 164 212 180 230" stroke="#451A03" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 220 230 Q 236 212 252 230" stroke="#451A03" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Eyebrows raised high -->
    <path d="M 144 208 Q 164 195 184 212" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 216 212 Q 236 195 256 208" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Hair -->
    <path d="M 120 235 C 112 150 160 135 200 135 C 245 135 288 150 280 235 C 275 190 250 165 220 170 C 190 175 170 160 150 180 C 130 200 125 220 120 235 Z" fill="url(#hair-ah)"/>
    <!-- Spiky bangs on forehead -->
    <polygon points="175,170 190,145 195,175" fill="url(#hair-ah)"/>
    <polygon points="195,170 215,145 220,175" fill="url(#hair-ah)"/>
    <polygon points="150,185 165,160 170,190" fill="url(#hair-ah)"/>

    <!-- Cupped Hands around mouth shouting -->
    <!-- Left Cupped Hand -->
    <path d="M 125 285 C 110 260 120 235 140 250 C 150 260 155 285 140 300 C 130 310 115 305 125 285 Z" fill="url(#skin-ah)"/>
    <path d="M 115 380 C 100 330 120 290 145 275" stroke="url(#skin-ah)" stroke-width="18" stroke-linecap="round"/>

    <!-- Right Cupped Hand -->
    <path d="M 275 285 C 290 260 280 235 260 250 C 250 260 245 285 260 300 C 270 310 285 305 275 285 Z" fill="url(#skin-ah)"/>
    <path d="M 285 380 C 300 330 280 290 255 275" stroke="url(#skin-ah)" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
