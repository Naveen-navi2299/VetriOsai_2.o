<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-ee" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </radialGradient>
    <filter id="shadow-ee" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369A1" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="shirt-ee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="brush-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="550" rx="36" fill="url(#bg-ee)"/>

  <!-- Fresh Clean Sparkles -->
  <polygon points="70,120 73,130 83,133 73,136 70,146 67,136 57,133 67,130" fill="#38BDF8"/>
  <polygon points="320,110 323,120 333,123 323,126 320,136 317,126 307,123 317,120" fill="#38BDF8"/>
  <polygon points="340,360 342,367 349,369 342,371 340,378 338,371 331,369 338,367" fill="#0284C7"/>
  <circle cx="80" cy="380" r="8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="95" cy="360" r="5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="310" cy="390" r="10" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="325" cy="410" r="6" fill="#FFFFFF" opacity="0.6"/>

  <!-- Character -->
  <g filter="url(#shadow-ee)">
    <!-- Shoulders & Teal Shirt -->
    <path d="M 90 550 C 90 425 130 400 200 400 C 270 400 310 425 310 550 Z" fill="url(#shirt-ee)"/>
    <!-- Pale Turquoise Star Emblem on Shirt -->
    <polygon points="200,430 206,448 225,448 210,460 216,478 200,466 184,478 190,460 175,448 194,448" fill="#CCFBF1" opacity="0.9"/>

    <!-- Neck -->
    <rect x="175" y="355" width="50" height="55" rx="8" fill="#FFE4D6"/>

    <!-- Ears -->
    <circle cx="120" cy="270" r="20" fill="#FFE4D6"/>
    <circle cx="120" cy="270" r="11" fill="#FDA4AF" opacity="0.5"/>
    <circle cx="280" cy="270" r="20" fill="#FFE4D6"/>
    <circle cx="280" cy="270" r="11" fill="#FDA4AF" opacity="0.5"/>

    <!-- Boy Head -->
    <ellipse cx="200" cy="265" rx="80" ry="88" fill="#FFE4D6"/>

    <!-- Cheeks -->
    <ellipse cx="145" cy="290" rx="16" ry="10" fill="#FB7185" opacity="0.45"/>
    <ellipse cx="255" cy="290" rx="16" ry="10" fill="#FB7185" opacity="0.45"/>

    <!-- Eyes (Big Happy Sparkling Eyes) -->
    <ellipse cx="160" cy="240" rx="12" ry="16" fill="#1E293B"/>
    <ellipse cx="240" cy="240" rx="12" ry="16" fill="#1E293B"/>
    <circle cx="156" cy="235" r="5" fill="#FFFFFF"/>
    <circle cx="163" cy="246" r="2.5" fill="#FFFFFF"/>
    <circle cx="236" cy="235" r="5" fill="#FFFFFF"/>
    <circle cx="243" cy="246" r="2.5" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M 145 220 Q 160 210 175 222" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 225 222 Q 240 210 255 220" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Nose -->
    <ellipse cx="200" cy="265" rx="5" ry="4" fill="#F472B6" opacity="0.6"/>

    <!-- Wide Grinning Mouth Showing Clean White Teeth ("Eee") -->
    <path d="M 150 285 C 150 325 250 325 250 285 C 220 280 180 280 150 285 Z" fill="#991B1B"/>
    <!-- Top & Bottom Clean Bright Teeth with grid separators -->
    <rect x="156" y="286" width="88" height="26" rx="8" fill="#FFFFFF"/>
    <line x1="156" y1="299" x2="244" y2="299" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="175" y1="286" x2="175" y2="312" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="192" y1="286" x2="192" y2="312" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="208" y1="286" x2="208" y2="312" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="225" y1="286" x2="225" y2="312" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Hair -->
    <path d="M 120 235 C 112 150 160 135 200 135 C 245 135 288 150 280 235 C 275 190 250 165 220 170 C 190 175 170 160 150 180 C 130 200 125 220 120 235 Z" fill="#78350F"/>
  </g>

  <!-- Blue Toothbrush & White Toothpaste Foam -->
  <g transform="translate(180, 290)" filter="url(#shadow-ee)">
    <!-- Brush Handle -->
    <rect x="20" y="30" width="130" height="16" rx="8" transform="rotate(-20 20 30)" fill="url(#brush-handle)"/>
    <!-- White Bristle Head -->
    <rect x="10" y="14" width="36" height="16" rx="4" transform="rotate(-20 10 14)" fill="#FFFFFF"/>
    <!-- Toothpaste Foam Bubbles on brush & mouth corner -->
    <circle cx="20" cy="10" r="10" fill="#FFFFFF"/>
    <circle cx="34" cy="6" r="12" fill="#FFFFFF"/>
    <circle cx="46" cy="12" r="8" fill="#FFFFFF"/>
    <circle cx="12" cy="18" r="7" fill="#E0F2FE"/>
    <circle cx="28" cy="16" r="8" fill="#BAE6FD"/>

    <!-- Sparkle on Toothbrush -->
    <polygon points="50,-2 52,4 58,6 52,8 50,14 48,8 42,6 48,4" fill="#38BDF8"/>
  </g>
</svg>
